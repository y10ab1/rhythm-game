<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<title>Rhythm Master feat. 孤夜</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="assets/guye/invite.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <button id="pauseBtn" class="hidden" aria-label="Pause"><i></i><i></i></button>

  <!-- Title -->
  <section id="titleScreen" class="screen show">
    <div class="scene-bg"></div>
    <img class="char-art" src="assets/guye/invite.webp" alt="">
    <div class="seg lang-seg title-lang" id="titleLang"><button data-v="zh">中文</button><button data-v="ja">日本語</button></div>
    <div class="title-main">
      <div class="logo">
        <span class="logo-a">RHYTHM</span>
        <span class="logo-b">MASTER</span>
        <span class="logo-feat">feat. 孤夜</span>
      </div>
      <nav class="menu">
        <button class="btn primary big" data-go="select">PLAY</button>
        <button class="btn" data-go="settings">SETTINGS</button>
        <button class="btn" id="btnTitleLeaderboard">RANKING</button>
      </nav>
      <div class="keys" id="titleKeys"></div>
    </div>
  </section>

  <!-- Song select -->
  <section id="selectScreen" class="screen">
    <div class="scene-bg"></div>
    <header class="topbar">
      <button class="icon-btn" data-go="title" aria-label="Back">‹</button>
      <div class="topbar-title">SELECT</div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">⚙</button>
    </header>
    <div class="select-layout">
      <div class="select-panel">
        <div class="jacket" id="jacket">
          <div class="jacket-genre" id="jacketGenre"></div>
          <div class="jacket-bpm"><b id="jacketBpm"></b><span>BPM</span></div>
          <div class="jacket-time" id="jacketTime"></div>
        </div>
        <div class="sel-title" id="selTitle"></div>
        <div class="diff-tabs" id="diffTabs"></div>
        <div class="select-info" id="selectInfo"></div>
        <button class="btn primary big wide" id="btnStart">START</button>
      </div>
      <div class="song-list" id="songList"></div>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.opus,.webm,.mid,.midi" multiple hidden>
  </section>

  <!-- Loading / analysis -->
  <section id="loadingScreen" class="screen">
    <div class="scene-bg"></div>
    <div class="loading-robots"><i class="robot black"></i><i class="robot white"></i></div>
    <div class="loading-title" id="loadingTitle" data-i18n="load.loading">Loading…</div>
    <div class="progress"><div id="loadingBar"></div></div>
    <div class="hint" id="loadingHint"></div>
  </section>

  <!-- Settings -->
  <section id="settingsScreen" class="screen">
    <div class="scene-bg"></div>
    <header class="topbar">
      <button class="icon-btn" id="btnSettingsBack" aria-label="Back">‹</button>
      <div class="topbar-title">SETTINGS</div>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="settings panel">
      <label class="row"><span data-i18n="set.speed">Scroll speed</span><input type="range" id="setSpeed" min="1" max="10" step="0.5"><output id="outSpeed"></output></label>
      <label class="row"><span data-i18n="set.offset">Audio offset</span><input type="range" id="setOffset" min="-200" max="200" step="1"><output id="outOffset"></output></label>
      <div class="row sub"><span></span><button class="btn small" id="btnCalibrate" data-i18n="set.calibrate">Calibrate 校正</button><span></span></div>
      <label class="row"><span data-i18n="set.music">Music</span><input type="range" id="setMusic" min="0" max="100"><output id="outMusic"></output></label>
      <label class="row"><span data-i18n="set.hit">Hit sound</span><input type="range" id="setHit" min="0" max="100"><output id="outHit"></output></label>
      <label class="row"><span>FAST / SLOW</span><input type="checkbox" id="setTiming"></label>
      <label class="row"><span data-i18n="set.noFail">No fail</span><input type="checkbox" id="setNoFail"></label>
      <label class="row"><span data-i18n="set.char">孤夜</span><input type="checkbox" id="setChar"></label>
      <div class="row"><span data-i18n="set.fx">演出</span><div class="seg" id="setFx"><button data-v="full" data-i18n="set.fx.full">標準</button><button data-v="lite" data-i18n="set.fx.lite">輕量</button></div><span></span></div>
      <div class="row"><span data-i18n="set.note">音符</span><div class="seg" id="setNote"><button data-v="bachi" data-i18n="set.note.bachi">撥子</button><button data-v="slab" data-i18n="set.note.slab">厚板</button><button data-v="sakura" data-i18n="set.note.sakura">櫻花</button><button data-v="glass" data-i18n="set.note.glass">玻璃</button></div><span></span></div>
      <div class="row"><span data-i18n="set.gimmick">譜面</span><div class="seg" id="setGimmick" title="華麗：掃弦 / 推弦 / 變速" data-i18n-title="set.gimmick.tip"><button data-v="on" data-i18n="set.gimmick.on">華麗</button><button data-v="off" data-i18n="set.gimmick.off">經典</button></div><span></span></div>
      <div class="row"><span data-i18n="set.lang">Language</span><div class="seg lang-seg" id="setLang"><button data-v="zh">中文</button><button data-v="ja">日本語</button></div><span></span></div>
      <div class="row keys-row name-setting"><span data-i18n="set.name">Name</span><input type="text" id="setName" maxlength="20" autocomplete="off" spellcheck="false"><button class="btn small" id="btnSetNameDice" title="Random name" data-i18n-title="set.dice">🎲</button></div>
      <label class="row"><span data-i18n="set.autoSubmit">Auto-submit</span><input type="checkbox" id="setAutoSubmit"></label>
      <label class="row" title="匿名的遊玩紀錄（成績、設定、每個音符的時機），用來調整譜面難度" data-i18n-title="set.playLog.tip"><span data-i18n="set.playLog">提供遊玩數據</span><input type="checkbox" id="setPlayLog"></label>
      <div class="row keys-row"><span data-i18n="set.keys">Keys</span><button class="btn small" id="btnRebind" data-i18n="set.change">Change</button><span class="keys inline" id="settingsKeys"></span></div>
    </div>
  </section>

  <!-- Calibration -->
  <section id="calibrateScreen" class="screen">
    <div class="scene-bg"></div>
    <header class="topbar">
      <button class="icon-btn" id="btnCalBack" aria-label="Back">‹</button>
      <div class="topbar-title">CALIBRATION</div>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="cal-ring" id="calRing"><span id="calCount"></span></div>
    <div class="cal-text" id="calText" data-i18n="cal.text">跟著節拍，每一拍按一下</div>
    <div class="cal-result" id="calResult"></div>
    <button class="btn primary" id="btnCalStart">Start</button>
    <button class="btn hidden" id="btnCalApply" data-i18n="cal.apply">Apply</button>
  </section>

  <!-- Pause -->
  <section id="pauseScreen" class="screen dim">
    <div class="pause-title">PAUSE</div>
    <button class="btn primary" id="btnResume">RESUME</button>
    <button class="btn" id="btnPauseRetry">RETRY</button>
    <button class="btn" id="btnQuit">QUIT</button>
  </section>

  <!-- Results -->
  <section id="resultsScreen" class="screen">
    <div class="scene-bg"></div>
    <img class="char-art" id="resArt" alt="">
    <div class="res-line" id="resLine"></div>
    <div class="res-card panel">
      <div class="res-head"><span class="res-song" id="resSong"></span><span class="diff-badge" id="resDiff"></span></div>
      <div class="res-main">
        <div class="res-rank" id="resRank">S</div>
        <div class="res-scorebox">
          <div class="res-score" id="resScore">0</div>
          <div class="res-accrow"><div class="acc-bar"><i id="resAccBar"></i></div><span id="resAcc"></span></div>
          <div class="res-badge" id="resBadge"></div>
        </div>
      </div>
      <div class="res-bars">
        <div class="jrow perfect"><span>PERFECT</span><div class="jbar"><i id="barPerfect"></i></div><b id="resPerfect">0</b></div>
        <div class="jrow great"><span>GREAT</span><div class="jbar"><i id="barGreat"></i></div><b id="resGreat">0</b></div>
        <div class="jrow good"><span>GOOD</span><div class="jbar"><i id="barGood"></i></div><b id="resGood">0</b></div>
        <div class="jrow miss"><span>MISS</span><div class="jbar"><i id="barMiss"></i></div><b id="resMiss">0</b></div>
      </div>
      <div class="res-mini">
        <div><b id="resCombo">0</b><span>MAX COMBO</span></div>
        <div><b id="resFastSlow">0 / 0</b><span>FAST / SLOW</span></div>
      </div>
      <div class="res-offset" id="resOffset"></div>
      <div class="name-row">
        <input type="text" id="playerName" placeholder="Name" data-i18n-placeholder="res.name" maxlength="20" autocomplete="off" spellcheck="false">
        <button class="btn small" id="btnNameDice" title="Random name" data-i18n-title="set.dice">🎲</button>
        <button class="btn small" id="btnSubmit">Submit</button>
      </div>
      <div class="submit-status" id="submitStatus"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnRetry">RETRY</button>
        <button class="btn" id="btnResLeaderboard">RANKING</button>
        <button class="btn" id="btnResBack">SONGS</button>
      </div>
    </div>
  </section>

  <!-- Leaderboard -->
  <section id="leaderboardScreen" class="screen">
    <div class="scene-bg"></div>
    <header class="topbar">
      <button class="icon-btn" id="btnLbBack" aria-label="Back">‹</button>
      <div class="topbar-title">RANKING</div>
      <span class="icon-btn ghost"></span>
    </header>
    <div class="lb-tabs">
      <button class="lb-tab" data-tab="song" data-i18n="lb.song">This song</button>
      <button class="lb-tab" data-tab="global" data-i18n="lb.global">Global</button>
    </div>
    <div class="lb-wrap panel">
      <div class="lb-msg" id="lbMsg" data-i18n="lb.loading">Loading…</div>
      <table class="lb-table" id="lbTable"><thead></thead><tbody id="lbBody"></tbody></table>
    </div>
  </section>

  <div id="wipe"><i></i><i></i><i></i></div>
  <div id="dropHint" data-i18n="drop.hint">放開以加入歌曲 · Drop to add song</div>
  <div id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

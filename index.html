<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06050d">
<title>Rhythm Master</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <button id="pauseBtn" class="hidden" aria-label="Pause">❚❚</button>

  <!-- Title -->
  <section id="titleScreen" class="screen show">
    <div class="logo">RHYTHM</div>
    <div class="subtitle">MASTER · 4K</div>
    <button class="btn primary" data-go="select">Play</button>
    <button class="btn" data-go="settings">Settings</button>
    <button class="btn" id="btnTitleLeaderboard">Leaderboard</button>
    <div class="keys" id="titleKeys"></div>
    <div class="hint">鍵盤 D F J K（可在設定中修改）· 手機直接點擊軌道<br>第一次玩建議先到 Settings → Calibrate 校正延遲</div>
  </section>

  <!-- Song select -->
  <section id="selectScreen" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-go="title" aria-label="Back">‹</button>
      <div class="topbar-title">SELECT SONG</div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">⚙</button>
    </div>
    <div class="song-list" id="songList"></div>
    <div class="select-panel">
      <div class="diff-tabs" id="diffTabs"></div>
      <div class="select-info" id="selectInfo"></div>
      <button class="btn primary wide" id="btnStart">Start</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.opus,.webm,.mid,.midi" multiple hidden>
  </section>

  <!-- Loading / analysis -->
  <section id="loadingScreen" class="screen">
    <div class="loading-title" id="loadingTitle">Loading…</div>
    <div class="progress"><div id="loadingBar"></div></div>
    <div class="hint" id="loadingHint"></div>
  </section>

  <!-- Settings -->
  <section id="settingsScreen" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btnSettingsBack" aria-label="Back">‹</button>
      <div class="topbar-title">SETTINGS</div>
      <span class="icon-btn ghost"></span>
    </div>
    <div class="settings">
      <label class="row"><span>Scroll speed</span><input type="range" id="setSpeed" min="1" max="10" step="0.5"><output id="outSpeed"></output></label>
      <label class="row"><span>Audio offset</span><input type="range" id="setOffset" min="-200" max="200" step="1"><output id="outOffset"></output></label>
      <div class="row sub"><span></span><button class="btn small" id="btnCalibrate">Calibrate 校正</button><span class="note">正值 = 你的設備聲音較晚到</span></div>
      <label class="row"><span>Music volume</span><input type="range" id="setMusic" min="0" max="100"><output id="outMusic"></output></label>
      <label class="row"><span>Hit sound</span><input type="range" id="setHit" min="0" max="100"><output id="outHit"></output></label>
      <label class="row"><span>Show FAST/SLOW</span><input type="checkbox" id="setTiming"></label>
      <label class="row"><span>No fail</span><input type="checkbox" id="setNoFail"></label>
      <div class="row keys-row"><span>Keys</span><button class="btn small" id="btnRebind">Change</button><span class="keys inline" id="settingsKeys"></span></div>
    </div>
  </section>

  <!-- Calibration -->
  <section id="calibrateScreen" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btnCalBack" aria-label="Back">‹</button>
      <div class="topbar-title">CALIBRATION</div>
      <span class="icon-btn ghost"></span>
    </div>
    <div class="cal-ring" id="calRing"><span id="calCount"></span></div>
    <div class="cal-text" id="calText">跟著節拍聲，在每一拍按任意軌道鍵（或點擊畫面）。<br>前 4 拍為預備拍。</div>
    <div class="cal-result" id="calResult"></div>
    <button class="btn primary" id="btnCalStart">Start</button>
    <button class="btn hidden" id="btnCalApply">Apply</button>
  </section>

  <!-- Pause -->
  <section id="pauseScreen" class="screen dim">
    <div class="screen-title">PAUSED</div>
    <button class="btn primary" id="btnResume">Resume</button>
    <button class="btn" id="btnPauseRetry">Retry</button>
    <button class="btn" id="btnQuit">Quit</button>
  </section>

  <!-- Results -->
  <section id="resultsScreen" class="screen">
    <div class="res-song" id="resSong"></div>
    <div class="res-rank" id="resRank">S</div>
    <div class="res-score" id="resScore">0</div>
    <div class="res-acc" id="resAcc"></div>
    <div class="res-grid">
      <div><b class="c-perfect" id="resPerfect">0</b><span>Perfect</span></div>
      <div><b class="c-great" id="resGreat">0</b><span>Great</span></div>
      <div><b class="c-good" id="resGood">0</b><span>Good</span></div>
      <div><b class="c-miss" id="resMiss">0</b><span>Miss</span></div>
      <div><b id="resCombo">0</b><span>Max combo</span></div>
      <div><b id="resFastSlow">0 / 0</b><span>Fast / Slow</span></div>
    </div>
    <div class="res-offset" id="resOffset"></div>
    <div class="name-row">
      <input type="text" id="playerName" placeholder="Your name" maxlength="20" autocomplete="off">
      <button class="btn small" id="btnSubmit">Submit</button>
    </div>
    <div class="submit-status" id="submitStatus"></div>
    <div class="btn-row">
      <button class="btn primary" id="btnRetry">Retry</button>
      <button class="btn" id="btnResLeaderboard">Ranking</button>
      <button class="btn" id="btnResBack">Songs</button>
    </div>
  </section>

  <!-- Leaderboard -->
  <section id="leaderboardScreen" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btnLbBack" aria-label="Back">‹</button>
      <div class="topbar-title">LEADERBOARD</div>
      <span class="icon-btn ghost"></span>
    </div>
    <div class="lb-tabs">
      <button class="lb-tab" data-tab="song">This song</button>
      <button class="lb-tab" data-tab="global">Global</button>
    </div>
    <div class="lb-wrap">
      <div class="lb-msg" id="lbMsg">Loading…</div>
      <table class="lb-table" id="lbTable"><thead></thead><tbody id="lbBody"></tbody></table>
    </div>
  </section>

  <div id="dropHint">放開以加入歌曲 · Drop to add song</div>
  <div id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

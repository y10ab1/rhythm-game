name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # build and deploy are separate jobs (GitHub's starter layout): deploy-pages looking up the artifact
  # moments after it was uploaded in the same job sometimes found nothing ("Found 0 artifact(s)")
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # only what the game loads (the rest of the repo is tools, the worker and the site config)
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html css js songs _site/
      # the 孤夜 art and MVs are not in the repo: this copy loads them from guye.gamaniaocc.com (R2, CORS open)
      - name: Point assets/guye/ at guye.gamaniaocc.com
        working-directory: _site
        run: sed -i 's#\(\.\./\)\?assets/guye/#https://guye.gamaniaocc.com/assets/guye/#g' index.html css/style.css js/character.js js/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
